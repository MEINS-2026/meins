name: Auto Update Posts List

on:
  push:
    paths:
      - 'posts/**' # posts/ フォルダの中身が変わったときだけ発動

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate posts.json
        run: |
          cd posts
          # .mdファイルの一覧を自動で集めて posts.json を生成するスクリプト
          echo "[" > posts.json
          first=true
          for f in *.md; do
            if [ -f "$f" ]; then
              slug=$(basename "$f" .md)
              # 1行目のタイトルを自動抽出
              title=$(head -n 1 "$f" | sed 's/^# *//')
              if [ "$first" = true ]; then
                first=false
              else
                echo "," >> posts.json
              fi
              echo "  {\"slug\": \"$slug\", \"title\": \"$title\"}" >> posts.json
            fi
          done
          echo "]" >> posts.json
          cd ..

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update posts.json"
          file_pattern: "posts/posts.json"
